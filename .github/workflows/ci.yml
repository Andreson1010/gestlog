name: CI

on:
  push:
    branches:
      - main
      - feat/f1-mvp
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: black + ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Check formatting
        run: uv run black --check src/ tests/ alembic/

      - name: Lint
        run: uv run ruff check src/ tests/ alembic/

      - name: Tests
        run: uv run pytest

  postgres:
    name: pytest (Postgres, matriz de dialetos)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gestlog
          POSTGRES_PASSWORD: gestlog
          POSTGRES_DB: gestlog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GESTLOG_TEST_DATABASE_URL: postgresql+psycopg://gestlog:gestlog@localhost:5432/gestlog_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Tests (Postgres)
        run: uv run pytest --no-cov
