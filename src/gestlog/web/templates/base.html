<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block titulo %}{{ titulo | default("gestlog") }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}" />
    <script
      src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
      integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
      crossorigin="anonymous"
      defer
    ></script>
    <script
      src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"
      integrity="sha384-fw+eTlCc7suMV/1w/7fr2/PmwElUIt5i82bi+qTiLXvjRXZ2/FkiTNA/w0MhXnGI"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <header class="topo">
      <strong>gestlog</strong>
      <nav>
        <a href="/">Início</a>
        <a href="/importar">Importar</a>
        <a href="/chat">Chat</a>
      </nav>
    </header>
    <main class="conteudo">
      {% block conteudo %}
      <p>Bem-vindo ao gestlog.</p>
      {% endblock %}
    </main>
  </body>
</html>
