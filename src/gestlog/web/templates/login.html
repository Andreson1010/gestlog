{% extends "base.html" %}
{% block titulo %}Entrar · gestlog{% endblock %}
{% block layout %}
<main class="publico">
  <div class="cartao">
    <div class="marca">
      <span class="marca-selo">g</span>
      gestlog
    </div>
    <h1>Entrar</h1>
    <form
      hx-post="/auth/login"
      hx-target="#erro-login"
      hx-swap="innerHTML"
      hx-on::after-request="if (event.detail.successful) window.location='/'"
    >
      <div class="campo">
        <label for="username">E-mail</label>
        <input
          id="username"
          name="username"
          type="email"
          autocomplete="username"
          required
        />
      </div>
      <div class="campo">
        <label for="password">Senha</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
      </div>
      <button class="botao" type="submit">Entrar</button>
    </form>
    <div id="erro-login" class="aviso erro" role="alert"></div>
    <p class="rodape-form">Não tem conta? <a href="/cadastro">Criar conta</a></p>
  </div>
</main>
{% endblock %}
