<div class="turno">
  <div class="bolha">{{ pergunta }}</div>
  <div
    class="agente"
    hx-ext="sse"
    sse-connect="/chat/stream?pergunta={{ pergunta | urlencode }}"
    sse-close="fim"
  >
    <div class="resposta" hx-swap="textContent" sse-swap="resposta">
      <span class="carregando">Consultando…</span>
    </div>
    <div class="feedback-ao-vivo" sse-swap="fontes" hx-swap="innerHTML"></div>
  </div>
</div>
