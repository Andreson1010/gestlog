<div class="turno">
  <div class="bolha">{{ pergunta }}</div>
  <div class="agente">
    <div
      class="resposta"
      hx-ext="sse"
      hx-swap="textContent"
      sse-connect="/chat/stream?pergunta={{ pergunta | urlencode }}"
      sse-swap="resposta"
      sse-close="fim"
    >
      <span class="carregando">Consultando…</span>
    </div>
  </div>
</div>
